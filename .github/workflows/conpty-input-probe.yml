name: conpty input probe (temporary)
on:
  push:
    branches: [nwparker/conpty-input-probe]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          persist-native-cache: 'false'
      - name: Probe ConPTY input under load
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: node config/scripts/conpty-input-probe.cjs
